<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070a12" />
  <title>404 · 彦骁的笔记</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: #cbd5e1;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, .09), transparent 35%),
        #070a12;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(720px, 100%); }
    code { color: #fda4af; letter-spacing: .14em; }
    h1 { margin: 24px 0 0; color: #fff; font-size: clamp(36px, 7vw, 64px); }
    p { margin: 20px 0 32px; color: #64748b; line-height: 1.8; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      color: #071018;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #cffafe; }
  </style>
</head>
<body>
  <main>
    <code>404 / OBJECT_NOT_FOUND</code>
    <h1>这里没有对应的页面</h1>
    <p>路径可能已经调整，或者内容仍在整理中。</p>
    <a href="/#/">返回首页</a>

</body>
</html>
