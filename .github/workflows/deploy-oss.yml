name: Build and Deploy to Aliyun OSS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Quality, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and test private authentication function
        run: |
          set -euo pipefail
          npm ci --prefix functions/private-auth
          npm test --prefix functions/private-auth

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort | head -100

      - name: Package private authentication function
        id: private_function
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="functions/private-auth"
          PACKAGE_DIR="${RUNNER_TEMP}/private-auth-package"
          ARTIFACT_DIR="${RUNNER_TEMP}/private-auth-artifact"

          mkdir -p "${PACKAGE_DIR}" "${ARTIFACT_DIR}"
          cp "${SOURCE_DIR}/index.js" "${PACKAGE_DIR}/index.js"
          cp "${SOURCE_DIR}/package.json" "${PACKAGE_DIR}/package.json"
          cp "${SOURCE_DIR}/package-lock.json" "${PACKAGE_DIR}/package-lock.json"
          cp -R "${SOURCE_DIR}/node_modules" "${PACKAGE_DIR}/node_modules"

          (
            cd "${PACKAGE_DIR}"
            zip -q -r "${ARTIFACT_DIR}/private-auth.zip" \
              index.js package.json package-lock.json node_modules
          )
          (
            cd "${ARTIFACT_DIR}"
            sha256sum private-auth.zip > private-auth.sha256
          )

          ZIP_LIST="${ARTIFACT_DIR}/private-auth.files.txt"
          unzip -Z1 "${ARTIFACT_DIR}/private-auth.zip" > "${ZIP_LIST}"
          grep -Fx 'index.js' "${ZIP_LIST}" >/dev/null
          grep -Fx 'package.json' "${ZIP_LIST}" >/dev/null
          grep -E '^node_modules/' "${ZIP_LIST}" >/dev/null
          if grep -Eq '(^|/)\.\.(/|$)' "${ZIP_LIST}"; then
            echo "::error::Function ZIP contains an unsafe path."
            exit 1
          fi

          echo "artifact_dir=${ARTIFACT_DIR}" >> "${GITHUB_OUTPUT}"
          echo "Function artifact:"
          cat "${ARTIFACT_DIR}/private-auth.sha256"

      - name: Validate deployment configuration
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${OSS_ACCESS_KEY_ID}" || {
            echo "::error::Missing repository secret ALIYUN_OSS_ACCESS_KEY_ID"
            exit 1
          }
          test -n "${OSS_ACCESS_KEY_SECRET}" || {
            echo "::error::Missing repository secret ALIYUN_OSS_ACCESS_KEY_SECRET"
            exit 1
          }
          test -n "${OSS_REGION}" || {
            echo "::error::Missing repository variable ALIYUN_OSS_REGION"
            exit 1
          }
          test -n "${OSS_TARGET}" || {
            echo "::error::Missing repository variable ALIYUN_OSS_TARGET"
            exit 1
          }

          case "${OSS_TARGET}" in
            oss://*) ;;
            *)
              echo "::error::ALIYUN_OSS_TARGET must start with oss://"
              exit 1
              ;;
          esac

      - name: Validate private function artifact configuration
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${OSS_ACCESS_KEY_ID}" || {
            echo "::error::Missing secret ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID"
            exit 1
          }
          test -n "${OSS_ACCESS_KEY_SECRET}" || {
            echo "::error::Missing secret ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET"
            exit 1
          }
          test -n "${OSS_REGION}" || {
            echo "::error::Missing variable ALIYUN_PRIVATE_LEARNING_OSS_REGION"
            exit 1
          }
          test -n "${OSS_TARGET}" || {
            echo "::error::Missing variable ALIYUN_PRIVATE_LEARNING_OSS_TARGET"
            exit 1
          }

          if [[ ! "${OSS_TARGET}" =~ ^oss://[^/]+(/learning-assets)?/?$ ]]; then
            echo "::error::ALIYUN_PRIVATE_LEARNING_OSS_TARGET must identify the private bucket or its /learning-assets prefix"
            exit 1
          fi

      - name: Install ossutil
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          OSSUTIL_VERSION="2.3.0"
          OSSUTIL_ZIP="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          OSSUTIL_SHA256="3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a"

          curl -fsSLo "${OSSUTIL_ZIP}" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${OSSUTIL_ZIP}"

          echo "${OSSUTIL_SHA256}  ${OSSUTIL_ZIP}" | sha256sum -c -
          unzip -q "${OSSUTIL_ZIP}"

          sudo install -m 0755 \
            "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            /usr/local/bin/ossutil

          ossutil version

      - name: Deploy website and wedding assets
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${OSS_TARGET%/}/"
          echo "Uploading dist/ to ${TARGET}"

          # One sync is enough. Content-hashed Vite assets keep a long cache policy;
          # index.html is overwritten below with an explicit revalidation policy.
          ossutil sync \
            dist/ \
            "${TARGET}" \
            --cache-control "public,max-age=31536000,immutable" \
            -f

          ossutil cp \
            dist/index.html \
            "${TARGET}index.html" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            -f

          if [[ -f dist/404.html ]]; then
            ossutil cp \
              dist/404.html \
              "${TARGET}404.html" \
              --cache-control "no-cache,max-age=0,must-revalidate" \
              --content-type "text/html; charset=utf-8" \
              -f
          fi

          WEDDING_SOURCE_DIR="src/assets/gallery"
          WEDDING_TARGET="${TARGET}wedding-assets/"
          LOCAL_HASH_FILE="${RUNNER_TEMP}/wedding-source.sha256"
          REMOTE_HASH_FILE="${RUNNER_TEMP}/wedding-source.remote.sha256"
          WEDDING_BUILD_DIR="${RUNNER_TEMP}/wedding-assets"

          find "${WEDDING_SOURCE_DIR}" -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | awk '{print $1}' > "${LOCAL_HASH_FILE}"

          WEDDING_CHANGED=true
          if ossutil stat "${WEDDING_TARGET}source.sha256" >/dev/null 2>&1; then
            ossutil cp \
              "${WEDDING_TARGET}source.sha256" \
              "${REMOTE_HASH_FILE}" \
              -f >/dev/null
            if cmp -s "${LOCAL_HASH_FILE}" "${REMOTE_HASH_FILE}"; then
              WEDDING_CHANGED=false
            fi
          fi

          if [[ "${WEDDING_CHANGED}" == "true" ]]; then
            echo "Wedding source images changed; generating optimized WebP assets."

            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
            fi

            mkdir -p "${WEDDING_BUILD_DIR}/hero" "${WEDDING_BUILD_DIR}/story"

            for section in hero story; do
              while IFS= read -r -d '' source; do
                filename="$(basename "${source}")"
                stem="${filename%.*}"
                for width in 640 1080 1440; do
                  convert \
                    "${source}" \
                    -auto-orient \
                    -strip \
                    -resize "${width}x>" \
                    -quality 82 \
                    "${WEDDING_BUILD_DIR}/${section}/${stem}-${width}.webp"
                done
              done < <(
                find "${WEDDING_SOURCE_DIR}/${section}" -maxdepth 1 -type f \
                  \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
                  -print0 | sort -z
              )
            done

            echo "Optimized wedding assets:"
            find "${WEDDING_BUILD_DIR}" -type f -printf '%P %s bytes\n' | sort

            ossutil sync \
              "${WEDDING_BUILD_DIR}/" \
              "${WEDDING_TARGET}" \
              -f

            ossutil cp \
              "${LOCAL_HASH_FILE}" \
              "${WEDDING_TARGET}source.sha256" \
              --content-type "text/plain; charset=utf-8" \
              -f
          else
            echo "Wedding source images unchanged; skipping image generation and upload."
          fi

          echo "Deployment completed."

      - name: Upload private authentication function artifact
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
          ARTIFACT_DIR: ${{ steps.private_function.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_NAME="${OSS_TARGET#oss://}"
          BUCKET_NAME="${BUCKET_NAME%%/*}"
          TARGET="oss://${BUCKET_NAME}/functions"
          ZIP_TARGET="${TARGET}/private-auth.zip"
          SHA_TARGET="${TARGET}/private-auth.sha256"

          ossutil cp \
            "${ARTIFACT_DIR}/private-auth.zip" \
            "${ZIP_TARGET}" \
            --content-type "application/zip" \
            --content-disposition "attachment; filename=private-auth.zip" \
            -f
          ossutil stat "${ZIP_TARGET}" >/dev/null

          ossutil cp \
            "${ARTIFACT_DIR}/private-auth.sha256" \
            "${SHA_TARGET}" \
            --content-type "text/plain; charset=utf-8" \
            --content-disposition "inline" \
            -f
          ossutil stat "${SHA_TARGET}" >/dev/null

          echo "Uploaded and verified private authentication function artifacts."
