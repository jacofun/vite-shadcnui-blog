name: Build and Deploy to Aliyun OSS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "functions/private-auth/**"
      - "scripts/deploy-fc-code.py"
      - ".github/workflows/deploy-fc.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "functions/private-auth/**"
      - "scripts/deploy-fc-code.py"
      - ".github/workflows/deploy-fc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-oss-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Quality, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html
          test -f dist/404.html
          echo "${GITHUB_SHA}" > dist/deploy-version.txt
          echo "Build output:"
          find dist -maxdepth 2 -type f | sort | head -100

      - name: Validate deployment configuration
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${OSS_ACCESS_KEY_ID}" || {
            echo "::error::Missing repository secret ALIYUN_OSS_ACCESS_KEY_ID"
            exit 1
          }
          test -n "${OSS_ACCESS_KEY_SECRET}" || {
            echo "::error::Missing repository secret ALIYUN_OSS_ACCESS_KEY_SECRET"
            exit 1
          }
          test -n "${OSS_REGION}" || {
            echo "::error::Missing repository variable ALIYUN_OSS_REGION"
            exit 1
          }
          test -n "${OSS_TARGET}" || {
            echo "::error::Missing repository variable ALIYUN_OSS_TARGET"
            exit 1
          }

          case "${OSS_TARGET}" in
            oss://*) ;;
            *)
              echo "::error::ALIYUN_OSS_TARGET must start with oss://"
              exit 1
              ;;
          esac

      - name: Install ossutil
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          OSSUTIL_VERSION="2.3.0"
          OSSUTIL_ZIP="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          OSSUTIL_SHA256="3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a"

          curl -fsSLo "${OSSUTIL_ZIP}" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${OSSUTIL_ZIP}"

          echo "${OSSUTIL_SHA256}  ${OSSUTIL_ZIP}" | sha256sum -c -
          unzip -q "${OSSUTIL_ZIP}"

          sudo install -m 0755 \
            "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            /usr/local/bin/ossutil

          ossutil version

      - name: Deploy website and wedding assets
        if: github.event_name != 'pull_request'
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${OSS_TARGET%/}/"
          echo "Uploading dist/ to ${TARGET}"

          # Content-hashed JS/CSS/assets are safe to cache for a year.
          ossutil sync \
            dist/ \
            "${TARGET}" \
            --cache-control "public,max-age=31536000,immutable" \
            -f

          # BrowserRouter route shells are HTML too. Override every HTML object
          # with revalidation semantics so nested routes cannot remain stale.
          while IFS= read -r -d '' html_file; do
            relative_path="${html_file#dist/}"
            ossutil cp \
              "${html_file}" \
              "${TARGET}${relative_path}" \
              --cache-control "no-cache,max-age=0,must-revalidate" \
              --content-type "text/html; charset=utf-8" \
              -f
          done < <(find dist -type f -name '*.html' -print0)

          ossutil cp \
            dist/deploy-version.txt \
            "${TARGET}deploy-version.txt" \
            --cache-control "no-cache,max-age=0,must-revalidate" \
            --content-type "text/plain; charset=utf-8" \
            -f

          WEDDING_SOURCE_DIR="src/assets/gallery"
          WEDDING_TARGET="${TARGET}wedding-assets/"
          LOCAL_HASH_FILE="${RUNNER_TEMP}/wedding-source.sha256"
          REMOTE_HASH_FILE="${RUNNER_TEMP}/wedding-source.remote.sha256"
          WEDDING_BUILD_DIR="${RUNNER_TEMP}/wedding-assets"

          find "${WEDDING_SOURCE_DIR}" -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | awk '{print $1}' > "${LOCAL_HASH_FILE}"

          WEDDING_CHANGED=true
          if ossutil stat "${WEDDING_TARGET}source.sha256" >/dev/null 2>&1; then
            ossutil cp \
              "${WEDDING_TARGET}source.sha256" \
              "${REMOTE_HASH_FILE}" \
              -f >/dev/null
            if cmp -s "${LOCAL_HASH_FILE}" "${REMOTE_HASH_FILE}"; then
              WEDDING_CHANGED=false
            fi
          fi

          if [[ "${WEDDING_CHANGED}" == "true" ]]; then
            echo "Wedding source images changed; generating optimized WebP assets."

            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
            fi

            mkdir -p "${WEDDING_BUILD_DIR}/hero" "${WEDDING_BUILD_DIR}/story"

            for section in hero story; do
              while IFS= read -r -d '' source; do
                filename="$(basename "${source}")"
                stem="${filename%.*}"
                for width in 640 1080 1440; do
                  convert \
                    "${source}" \
                    -auto-orient \
                    -strip \
                    -resize "${width}x>" \
                    -quality 82 \
                    "${WEDDING_BUILD_DIR}/${section}/${stem}-${width}.webp"
                done
              done < <(
                find "${WEDDING_SOURCE_DIR}/${section}" -maxdepth 1 -type f \
                  \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
                  -print0 | sort -z
              )
            done

            echo "Optimized wedding assets:"
            find "${WEDDING_BUILD_DIR}" -type f -printf '%P %s bytes\n' | sort

            ossutil sync \
              "${WEDDING_BUILD_DIR}/" \
              "${WEDDING_TARGET}" \
              -f

            ossutil cp \
              "${LOCAL_HASH_FILE}" \
              "${WEDDING_TARGET}source.sha256" \
              --content-type "text/plain; charset=utf-8" \
              -f
          else
            echo "Wedding source images unchanged; skipping image generation and upload."
          fi

          echo "Deployment completed."

      - name: Verify deployed version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_SHA}"
          VERSION_URL="https://yanxiao.me/deploy-version.txt?sha=${GITHUB_SHA}"
          ACTUAL="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 20 \
            "${VERSION_URL}" | tr -d '\r\n')"

          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::Deployed version mismatch: expected ${EXPECTED}, got ${ACTUAL:-<empty>}"
            exit 1
          fi

          echo "Verified deployed website version ${ACTUAL}."
