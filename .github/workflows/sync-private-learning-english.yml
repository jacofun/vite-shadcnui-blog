name: Sync Private 6 Minute English Lesson

on:
  push:
    branches:
      - feature/private_learning_english
    paths:
      - "private-learning-english/jobs/*.json"
  workflow_dispatch:
    inputs:
      job_file:
        description: "Repository-relative path to one lesson job JSON"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-learning-english-oss
  cancel-in-progress: false

env:
  OSS_OBJECT_PREFIX: private/english-learning/6minuteenglish
  PUBLIC_PATH_PREFIX: /private/english-learning/6minuteenglish

jobs:
  sync:
    name: Download BBC resources and sync to private OSS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve lesson job
        id: lesson_job
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
          MANUAL_JOB_FILE: ${{ inputs.job_file }}
        shell: bash
        run: |
          set -euo pipefail

          JOB_PATTERN='^private-learning-english/jobs/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$'

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            JOB_FILE="${MANUAL_JOB_FILE}"
          else
            if [[ "${EVENT_BEFORE}" =~ ^0+$ ]]; then
              mapfile -t JOB_FILES < <(
                git diff-tree --no-commit-id --name-only --diff-filter=AM -r "${EVENT_AFTER}" |
                  grep -E "${JOB_PATTERN}" || true
              )
            else
              mapfile -t JOB_FILES < <(
                git diff --name-only --diff-filter=AM "${EVENT_BEFORE}" "${EVENT_AFTER}" |
                  grep -E "${JOB_PATTERN}" || true
              )
            fi

            if [[ "${#JOB_FILES[@]}" -ne 1 ]]; then
              echo "::error::Each push must add or update exactly one lesson job JSON; found ${#JOB_FILES[@]}."
              exit 1
            fi
            JOB_FILE="${JOB_FILES[0]}"
          fi

          if [[ ! "${JOB_FILE}" =~ ${JOB_PATTERN} ]]; then
            echo "::error::Invalid job path: ${JOB_FILE}"
            exit 1
          fi

          if [[ ! -f "${JOB_FILE}" || -L "${JOB_FILE}" ]]; then
            echo "::error::Lesson job must be a regular repository file: ${JOB_FILE}"
            exit 1
          fi

          echo "job_file=${JOB_FILE}" >> "${GITHUB_OUTPUT}"
          echo "Resolved lesson job: ${JOB_FILE}"

      - name: Validate lesson job
        id: validate
        env:
          JOB_FILE: ${{ steps.lesson_job.outputs.job_file }}
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            type == "object" and
            .schemaVersion == 1 and
            (.recommendedDate | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
            (.episodeId | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$")) and
            (.title | type == "string" and length > 0 and length <= 200) and
            (.publishedAt | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
            (.sourcePage | type == "string") and
            (.audioSource | type == "string") and
            (.transcriptSource | type == "string") and
            (.reason | type == "string" and length > 0 and length <= 1000) and
            (.difficulty | type == "string" and length > 0 and length <= 20) and
            (.tags | type == "array" and length <= 20 and
              all(.[]; type == "string" and length > 0 and length <= 50))
          ' "${JOB_FILE}" >/dev/null || {
            echo "::error::Lesson job does not match schema version 1."
            exit 1
          }

          RECOMMENDED_DATE="$(jq -r '.recommendedDate' "${JOB_FILE}")"
          EPISODE_ID="$(jq -r '.episodeId' "${JOB_FILE}")"
          PUBLISHED_AT="$(jq -r '.publishedAt' "${JOB_FILE}")"
          SOURCE_PAGE="$(jq -r '.sourcePage' "${JOB_FILE}")"
          AUDIO_SOURCE="$(jq -r '.audioSource' "${JOB_FILE}")"
          TRANSCRIPT_SOURCE="$(jq -r '.transcriptSource' "${JOB_FILE}")"

          if [[ "$(basename "${JOB_FILE}" .json)" != "${RECOMMENDED_DATE}" ]]; then
            echo "::error::Job filename must equal recommendedDate."
            exit 1
          fi

          if [[ "$(date -d "${RECOMMENDED_DATE}" +'%Y-%m-%d' 2>/dev/null || true)" != "${RECOMMENDED_DATE}" ]]; then
            echo "::error::recommendedDate is not a valid calendar date."
            exit 1
          fi

          if [[ "$(date -d "${PUBLISHED_AT}" +'%Y-%m-%d' 2>/dev/null || true)" != "${PUBLISHED_AT}" ]]; then
            echo "::error::publishedAt is not a valid calendar date."
            exit 1
          fi

          if [[ ! "${SOURCE_PAGE}" =~ ^https://(www\.)?(bbc\.co\.uk|bbc\.com)/learningenglish/ ]]; then
            echo "::error::sourcePage must be an HTTPS BBC Learning English URL."
            exit 1
          fi

          if [[ ! "${AUDIO_SOURCE}" =~ ^https://downloads\.bbc\.co\.uk/learningenglish/[^\?\#]+\.mp3$ ]]; then
            echo "::error::audioSource must be an HTTPS MP3 under downloads.bbc.co.uk/learningenglish/."
            exit 1
          fi

          if [[ ! "${TRANSCRIPT_SOURCE}" =~ ^https://downloads\.bbc\.co\.uk/learningenglish/[^\?\#]+\.pdf$ ]]; then
            echo "::error::transcriptSource must be an HTTPS PDF under downloads.bbc.co.uk/learningenglish/."
            exit 1
          fi

          echo "episode_id=${EPISODE_ID}" >> "${GITHUB_OUTPUT}"
          echo "recommended_date=${RECOMMENDED_DATE}" >> "${GITHUB_OUTPUT}"
          echo "Validated episode ${EPISODE_ID} for ${RECOMMENDED_DATE}."

      - name: Validate OSS configuration
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${OSS_ACCESS_KEY_ID}" || {
            echo "::error::Missing secret ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID"
            exit 1
          }
          test -n "${OSS_ACCESS_KEY_SECRET}" || {
            echo "::error::Missing secret ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET"
            exit 1
          }
          test -n "${OSS_REGION}" || {
            echo "::error::Missing variable ALIYUN_PRIVATE_LEARNING_OSS_REGION"
            exit 1
          }
          test -n "${OSS_TARGET}" || {
            echo "::error::Missing variable ALIYUN_PRIVATE_LEARNING_OSS_TARGET"
            exit 1
          }

          if [[ ! "${OSS_TARGET}" =~ ^oss://[^/]+/?$ ]]; then
            echo "::error::ALIYUN_PRIVATE_LEARNING_OSS_TARGET must be a bucket root such as oss://bucket-name"
            exit 1
          fi

      - name: Install transcript tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v

      - name: Download, extract and verify BBC resources
        id: resources
        env:
          JOB_FILE: ${{ steps.lesson_job.outputs.job_file }}
          EPISODE_ID: ${{ steps.validate.outputs.episode_id }}
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP}/private-learning-english/${EPISODE_ID}"
          mkdir -p "${WORK_DIR}"

          AUDIO_SOURCE="$(jq -r '.audioSource' "${JOB_FILE}")"
          TRANSCRIPT_SOURCE="$(jq -r '.transcriptSource' "${JOB_FILE}")"

          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 4 --retry-all-errors --connect-timeout 20 --max-time 300 --output "${WORK_DIR}/audio.mp3" "${AUDIO_SOURCE}"

          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 --output "${WORK_DIR}/transcript.pdf" "${TRANSCRIPT_SOURCE}"

          AUDIO_SIZE="$(stat -c '%s' "${WORK_DIR}/audio.mp3")"
          PDF_SIZE="$(stat -c '%s' "${WORK_DIR}/transcript.pdf")"
          AUDIO_MIME="$(file --brief --mime-type "${WORK_DIR}/audio.mp3")"
          PDF_MIME="$(file --brief --mime-type "${WORK_DIR}/transcript.pdf")"

          if (( AUDIO_SIZE < 131072 || AUDIO_SIZE > 104857600 )); then
            echo "::error::Unexpected MP3 size: ${AUDIO_SIZE} bytes"
            exit 1
          fi

          case "${AUDIO_MIME}" in
            audio/mpeg|audio/mp3|application/octet-stream) ;;
            *)
              echo "::error::Unexpected MP3 MIME type: ${AUDIO_MIME}"
              exit 1
              ;;
          esac

          if (( PDF_SIZE < 1024 || PDF_SIZE > 20971520 )); then
            echo "::error::Unexpected transcript PDF size: ${PDF_SIZE} bytes"
            exit 1
          fi

          if [[ "$(head -c 5 "${WORK_DIR}/transcript.pdf")" != "%PDF-" ]]; then
            echo "::error::Transcript does not have a PDF signature."
            exit 1
          fi

          if [[ "${PDF_MIME}" != "application/pdf" ]]; then
            echo "::error::Unexpected transcript MIME type: ${PDF_MIME}"
            exit 1
          fi

          pdftotext -layout -enc UTF-8 -nopgbrk "${WORK_DIR}/transcript.pdf" "${WORK_DIR}/transcript.txt"
          sed -i 's/\r$//' "${WORK_DIR}/transcript.txt"

          TEXT_SIZE="$(stat -c '%s' "${WORK_DIR}/transcript.txt")"
          if (( TEXT_SIZE < 200 || TEXT_SIZE > 5242880 )); then
            echo "::error::Unexpected extracted transcript size: ${TEXT_SIZE} bytes"
            exit 1
          fi

          iconv -f UTF-8 -t UTF-8 "${WORK_DIR}/transcript.txt" >/dev/null || {
            echo "::error::Extracted transcript is not valid UTF-8."
            exit 1
          }

          if ! grep -Eq '[[:alpha:]]' "${WORK_DIR}/transcript.txt"; then
            echo "::error::Extracted transcript does not contain readable text."
            exit 1
          fi

          AUDIO_SHA256="$(sha256sum "${WORK_DIR}/audio.mp3" | cut -d ' ' -f 1)"
          PDF_SHA256="$(sha256sum "${WORK_DIR}/transcript.pdf" | cut -d ' ' -f 1)"
          TEXT_SHA256="$(sha256sum "${WORK_DIR}/transcript.txt" | cut -d ' ' -f 1)"
          SYNCED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          OBJECT_PREFIX="${PUBLIC_PATH_PREFIX}/${EPISODE_ID}"

          jq -n --slurpfile job "${JOB_FILE}" --arg syncedAt "${SYNCED_AT}" --arg objectPrefix "${OBJECT_PREFIX}" --arg audioSha256 "${AUDIO_SHA256}" --argjson audioBytes "${AUDIO_SIZE}" --arg pdfSha256 "${PDF_SHA256}" --argjson pdfBytes "${PDF_SIZE}" --arg textSha256 "${TEXT_SHA256}" --argjson textBytes "${TEXT_SIZE}" '{
              schemaVersion: 1,
              episodeId: $job[0].episodeId,
              title: $job[0].title,
              publishedAt: $job[0].publishedAt,
              recommendedDate: $job[0].recommendedDate,
              sourcePage: $job[0].sourcePage,
              audioSource: $job[0].audioSource,
              transcriptSource: $job[0].transcriptSource,
              reason: $job[0].reason,
              difficulty: $job[0].difficulty,
              tags: $job[0].tags,
              syncedAt: $syncedAt,
              objectPrefix: $objectPrefix,
              resources: {
                audio: {
                  path: ($objectPrefix + "/audio.mp3"),
                  contentType: "audio/mpeg",
                  bytes: $audioBytes,
                  sha256: $audioSha256
                },
                transcriptPdf: {
                  path: ($objectPrefix + "/transcript.pdf"),
                  contentType: "application/pdf",
                  bytes: $pdfBytes,
                  sha256: $pdfSha256
                },
                transcriptText: {
                  path: ($objectPrefix + "/transcript.txt"),
                  contentType: "text/plain; charset=utf-8",
                  bytes: $textBytes,
                  sha256: $textSha256
                }
              }
            }' > "${WORK_DIR}/metadata.json"

          jq -e . "${WORK_DIR}/metadata.json" >/dev/null

          echo "work_dir=${WORK_DIR}" >> "${GITHUB_OUTPUT}"
          echo "audio_bytes=${AUDIO_SIZE}" >> "${GITHUB_OUTPUT}"
          echo "pdf_bytes=${PDF_SIZE}" >> "${GITHUB_OUTPUT}"
          echo "text_bytes=${TEXT_SIZE}" >> "${GITHUB_OUTPUT}"
          echo "Downloaded and verified the BBC resources and extracted UTF-8 text."

      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail

          OSSUTIL_VERSION="2.3.0"
          OSSUTIL_ZIP="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          OSSUTIL_SHA256="3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a"

          curl -fsSLo "${OSSUTIL_ZIP}" "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${OSSUTIL_ZIP}"
          echo "${OSSUTIL_SHA256}  ${OSSUTIL_ZIP}" | sha256sum -c -
          unzip -q "${OSSUTIL_ZIP}"
          sudo install -m 0755 "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Upload lesson resources to private OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
          EPISODE_ID: ${{ steps.validate.outputs.episode_id }}
          WORK_DIR: ${{ steps.resources.outputs.work_dir }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_TARGET="${OSS_TARGET%/}"
          LESSON_ROOT="${BUCKET_TARGET}/${OSS_OBJECT_PREFIX}"
          EPISODE_TARGET="${LESSON_ROOT}/${EPISODE_ID}"

          ossutil cp "${WORK_DIR}/audio.mp3" "${EPISODE_TARGET}/audio.mp3" --content-type "audio/mpeg" -f
          ossutil cp "${WORK_DIR}/transcript.pdf" "${EPISODE_TARGET}/transcript.pdf" --content-type "application/pdf" --content-disposition "inline" -f
          ossutil cp "${WORK_DIR}/transcript.txt" "${EPISODE_TARGET}/transcript.txt" --content-type "text/plain; charset=utf-8" --content-disposition "inline" -f
          ossutil cp "${WORK_DIR}/metadata.json" "${EPISODE_TARGET}/metadata.json" --content-type "application/json; charset=utf-8" -f

          ossutil stat "${EPISODE_TARGET}/audio.mp3" >/dev/null
          ossutil stat "${EPISODE_TARGET}/transcript.pdf" >/dev/null
          ossutil stat "${EPISODE_TARGET}/transcript.txt" >/dev/null
          ossutil stat "${EPISODE_TARGET}/metadata.json" >/dev/null
          echo "Uploaded and verified all episode resources before publishing the index entry."

      - name: Update private lesson index
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
          WORK_DIR: ${{ steps.resources.outputs.work_dir }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_TARGET="${OSS_TARGET%/}"
          LESSON_ROOT="${BUCKET_TARGET}/${OSS_OBJECT_PREFIX}"
          INDEX_OBJECT="${LESSON_ROOT}/index.json"
          LOCAL_INDEX="${WORK_DIR}/index.json"
          UPDATED_INDEX="${WORK_DIR}/index.updated.json"
          INDEX_ENTRY="${WORK_DIR}/index-entry.json"
          UPDATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if ossutil stat "${INDEX_OBJECT}" >/dev/null 2>&1; then
            ossutil cp "${INDEX_OBJECT}" "${LOCAL_INDEX}" -f
          else
            printf '%s\n' '{"schemaVersion":1,"updatedAt":null,"episodes":[]}' > "${LOCAL_INDEX}"
          fi

          jq -e '
            type == "object" and
            .schemaVersion == 1 and
            (.episodes | type == "array")
          ' "${LOCAL_INDEX}" >/dev/null || {
            echo "::error::Existing private lesson index is invalid."
            exit 1
          }

          jq '{
            episodeId,
            title,
            publishedAt,
            recommendedDate,
            reason,
            difficulty,
            tags,
            metadataPath: (.objectPrefix + "/metadata.json")
          }' "${WORK_DIR}/metadata.json" > "${INDEX_ENTRY}"

          jq --slurpfile entry "${INDEX_ENTRY}" --arg updatedAt "${UPDATED_AT}" '.schemaVersion = 1 |
             .updatedAt = $updatedAt |
             .episodes = (
               ([.episodes[] | select(.episodeId != $entry[0].episodeId)] + [$entry[0]]) |
               sort_by(.recommendedDate) |
               reverse
             )' "${LOCAL_INDEX}" > "${UPDATED_INDEX}"

          jq -e . "${UPDATED_INDEX}" >/dev/null
          ossutil cp "${UPDATED_INDEX}" "${INDEX_OBJECT}" --content-type "application/json; charset=utf-8" -f
          ossutil stat "${INDEX_OBJECT}" >/dev/null
          echo "Published the private lesson index after all episode objects were uploaded."

      - name: Write job summary
        if: always()
        env:
          JOB_FILE: ${{ steps.lesson_job.outputs.job_file }}
          EPISODE_ID: ${{ steps.validate.outputs.episode_id }}
          RECOMMENDED_DATE: ${{ steps.validate.outputs.recommended_date }}
          AUDIO_BYTES: ${{ steps.resources.outputs.audio_bytes }}
          PDF_BYTES: ${{ steps.resources.outputs.pdf_bytes }}
          TEXT_BYTES: ${{ steps.resources.outputs.text_bytes }}
        shell: bash
        run: |
          {
            echo "## Private 6 Minute English sync"
            echo
            echo "- Job: \`${JOB_FILE:-unresolved}\`"
            echo "- Episode: \`${EPISODE_ID:-unresolved}\`"
            echo "- Recommended date: \`${RECOMMENDED_DATE:-unresolved}\`"
            echo "- Audio bytes: \`${AUDIO_BYTES:-unavailable}\`"
            echo "- Transcript PDF bytes: \`${PDF_BYTES:-unavailable}\`"
            echo "- Transcript text bytes: \`${TEXT_BYTES:-unavailable}\`"
            echo "- OSS path: \`${OSS_OBJECT_PREFIX}/${EPISODE_ID:-unresolved}/\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
