name: Test and Deploy Alibaba Cloud FC

on:
  push:
    branches:
      - main
    paths:
      - "functions/private-auth/**"
      - "scripts/deploy-fc-code.py"
      - ".github/workflows/deploy-fc.yml"
  pull_request:
    branches:
      - main
    paths:
      - "functions/private-auth/**"
      - "scripts/deploy-fc-code.py"
      - ".github/workflows/deploy-fc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliyun-fc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, Package and Deploy FC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/private-auth/package-lock.json

      - name: Install function dependencies
        run: npm ci --prefix functions/private-auth

      - name: Test function
        run: npm test --prefix functions/private-auth

      - name: Package function code
        id: package
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="functions/private-auth"
          PACKAGE_DIR="${RUNNER_TEMP}/fc-blog-authenticator-package"
          ZIP_PATH="${RUNNER_TEMP}/fc-blog-authenticator.zip"

          rm -rf "${PACKAGE_DIR}" "${ZIP_PATH}"
          mkdir -p "${PACKAGE_DIR}"

          cp "${SOURCE_DIR}/index.js" "${PACKAGE_DIR}/index.js"
          cp "${SOURCE_DIR}/server.js" "${PACKAGE_DIR}/server.js"
          cp "${SOURCE_DIR}/package.json" "${PACKAGE_DIR}/package.json"
          cp "${SOURCE_DIR}/package-lock.json" "${PACKAGE_DIR}/package-lock.json"
          cp -R "${SOURCE_DIR}/node_modules" "${PACKAGE_DIR}/node_modules"

          (
            cd "${PACKAGE_DIR}"
            zip -q -r "${ZIP_PATH}" index.js server.js package.json package-lock.json node_modules
          )

          unzip -t "${ZIP_PATH}" >/dev/null
          unzip -Z1 "${ZIP_PATH}" | grep -Fx 'index.js' >/dev/null
          unzip -Z1 "${ZIP_PATH}" | grep -Fx 'server.js' >/dev/null
          unzip -Z1 "${ZIP_PATH}" | grep -E '^node_modules/' >/dev/null

          echo "zip_path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
          echo "Function package size: $(du -h "${ZIP_PATH}" | cut -f1)"
          sha256sum "${ZIP_PATH}"

      - name: Setup Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FC deployment SDK
        if: github.event_name != 'pull_request'
        run: python -m pip install --disable-pip-version-check "alibabacloud_fc20230330==4.7.9"

      - name: Validate deployment credentials
        if: github.event_name != 'pull_request'
        env:
          ALIYUN_FC_ACCESS_KEY_ID: ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }}
          ALIYUN_FC_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ALIYUN_FC_ACCESS_KEY_ID \
            ALIYUN_FC_ACCESS_KEY_SECRET \
            OSS_ACCESS_KEY_ID \
            OSS_ACCESS_KEY_SECRET \
            OSS_REGION \
            OSS_TARGET; do
            test -n "${!name}" || {
              echo "::error::Missing required deployment setting: ${name}"
              exit 1
            }
          done
          case "${OSS_TARGET}" in
            oss://*) ;;
            *)
              echo "::error::ALIYUN_PRIVATE_LEARNING_OSS_TARGET must start with oss://"
              exit 1
              ;;
          esac

      - name: Install ossutil
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OSSUTIL_VERSION="2.3.0"
          OSSUTIL_ZIP="ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          OSSUTIL_SHA256="3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a"

          curl -fsSLo "${OSSUTIL_ZIP}" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/${OSSUTIL_ZIP}"
          echo "${OSSUTIL_SHA256}  ${OSSUTIL_ZIP}" | sha256sum -c -
          unzip -q "${OSSUTIL_ZIP}"
          sudo install -m 0755 \
            "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" \
            /usr/local/bin/ossutil

      - name: Upload FC package to OSS
        if: github.event_name != 'pull_request'
        id: fc_oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_PRIVATE_LEARNING_OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_REGION }}
          OSS_TARGET: ${{ vars.ALIYUN_PRIVATE_LEARNING_OSS_TARGET }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET_AND_PATH="${OSS_TARGET#oss://}"
          BUCKET_NAME="${BUCKET_AND_PATH%%/*}"
          OBJECT_NAME="functions/fc-cicd/fc-blog-authenticator-latest.zip"
          OBJECT_URI="oss://${BUCKET_NAME}/${OBJECT_NAME}"

          ossutil cp \
            "${ZIP_PATH}" \
            "${OBJECT_URI}" \
            --content-type "application/zip" \
            -f
          ossutil stat "${OBJECT_URI}" >/dev/null

          echo "bucket_name=${BUCKET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "object_name=${OBJECT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Uploaded function package to ${OBJECT_URI}"

      - name: Deploy code to Function Compute
        if: github.event_name != 'pull_request'
        env:
          ALIYUN_FC_ACCESS_KEY_ID: ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }}
          ALIYUN_FC_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }}
          ALIYUN_FC_REGION: cn-beijing
          ALIYUN_FC_FUNCTION_NAME: fc-blog-authenticator
          ALIYUN_FC_EXPECTED_RUNTIME: custom.debian10
          ALIYUN_FC_EXPECTED_HANDLER: server.handler
          ALIYUN_FC_CODE_OSS_BUCKET: ${{ steps.fc_oss.outputs.bucket_name }}
          ALIYUN_FC_CODE_OSS_OBJECT: ${{ steps.fc_oss.outputs.object_name }}
        run: python scripts/deploy-fc-code.py

      - name: Verify deployed function through public route
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          HEALTH_URL="https://yanxiao.me/api/private-auth/session"
          BODY="${RUNNER_TEMP}/fc-health.json"

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS \
              --max-time 20 \
              --output "${BODY}" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache' \
              "${HEALTH_URL}?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"

            if [[ "${HTTP_CODE}" == "401" ]]; then
              if python - "${BODY}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          if payload.get("code") != "UNAUTHENTICATED":
              raise SystemExit(f"unexpected health response: {payload}")
          PY
              then
                echo "Function health check passed through ${HEALTH_URL}."
                exit 0
              fi
            fi

            echo "Health check attempt ${attempt} returned HTTP ${HTTP_CODE}; retrying..."
            sleep 2
          done

          echo "::error::Function update completed but the public authentication route did not become healthy."
          cat "${BODY}" || true
          exit 1
